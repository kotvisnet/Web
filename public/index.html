<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoTrack</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="app">
    <section class="page active welcome-page" data-page="welcome">
      <div class="welcome-card">
        <h1>EcoTrack ♻️</h1>
        <p>Вы хотите сдать отходы?</p>
        <div class="welcome-actions">
          <button id="go-dropoff" class="btn btn-lg" type="button">Да, сдать отходы</button>
          <button id="go-stats" class="btn btn-ghost btn-lg" type="button">Ознакомиться / проверить статистику</button>
        </div>
      </div>
    </section>

    <section class="page" data-page="dropoff">
      <header class="simple-header">
        <button class="btn btn-ghost" data-route="welcome" type="button">← На главную</button>
        <button class="btn btn-ghost" data-route="profile" type="button">Моя статистика</button>
      </header>

      <section class="card">
        <h2>Сдать отходы</h2>
        <form id="user-form" class="grid-form user-form">
          <input id="user-id" type="number" min="1" placeholder="Ваш User ID" required />
          <button class="btn" type="submit">Сохранить User ID</button>
        </form>

        <form id="report-form" class="grid-form report-form">
          <select id="report-waste" required></select>
          <select id="report-point" required></select>
          <input id="report-weight" type="number" min="0.1" step="0.01" placeholder="Вес, кг" required />
          <button class="btn" type="submit">Отправить</button>
        </form>

        <p id="report-message" class="message"></p>
      </section>

      <section class="card">
        <h3>Категории отходов</h3>
        <div id="waste-gallery" class="gallery"></div>
      </section>
    </section>

    <section class="page" data-page="profile">
      <header class="simple-header">
        <button class="btn btn-ghost" data-route="welcome" type="button">← На главную</button>
        <button class="btn btn-ghost" data-route="dropoff" type="button">Сдать отходы</button>
      </header>

      <section class="card">
        <h2>Моя статистика</h2>
        <form id="profile-form" class="grid-form user-form">
          <input id="profile-id" type="number" min="1" placeholder="User ID" required />
          <button class="btn" type="submit">Показать</button>
        </form>
        <div class="stats-grid">
          <div class="stat"><span>Отчётов</span><strong id="stat-reports">0</strong></div>
          <div class="stat"><span>Вес (кг)</span><strong id="stat-weight">0</strong></div>
          <div class="stat"><span>Баллы</span><strong id="stat-points">0</strong></div>
        </div>
        <div id="badge-list" class="badges"></div>
      </section>

      <section class="card">
        <h3>Найти ближайший пункт</h3>
        <form id="nearest-form" class="grid-form user-form">
          <input id="nearest-city" placeholder="Введите город" required />
          <button class="btn" type="submit">Найти</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Название</th><th>Город</th><th>Адрес</th></tr></thead>
            <tbody id="points-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
